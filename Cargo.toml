[workspace]
resolver = "2"
members = [
    "crates/hdm-json",
    "crates/hdm-crypto",
    "crates/hdm-net",
    "crates/hdm-testserver",
    "crates/hdm-core",
    "crates/hdm-api",
    "crates/hdm-daemon",
    "crates/hdm-cli",
    "crates/hdm-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neo-the-hammer/IDM"
authors = ["Hydra Download Manager contributors"]

# Hydra has NO third-party dependencies. Everything is std + hand-written FFI to
# OS-provided TLS (OpenSSL on Unix, WinHTTP on Windows). Please keep it that way:
# a download manager is a security-sensitive network client, and an empty
# dependency tree is the strongest supply-chain guarantee we can offer.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
