[package]
name = "hydra-desktop"
version = "0.1.0"
edition = "2021"
description = "A native window around the Hydra Download Manager interface"
license = "MIT OR Apache-2.0"
publish = false

# This crate is deliberately outside the workspace: the rest of Hydra has an
# empty dependency tree, and adding Tauri would make `cargo build` at the
# repository root need a network connection and a system webview.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
